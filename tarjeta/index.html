<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu tarjeta de fidelidad - Llama a Jhon</title>

<!-- PWA: hace que "Mi tarjeta" se pueda instalar como app propia, con su
     propio ícono, separada del panel de administrador -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a6e4a">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<!-- OneSignal: envía las notificaciones push (recordatorios de mantenimiento
     y promociones) aunque la app esté cerrada -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  body {
    margin: 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background: #F1FBF6;
    display: flex;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .wrap { width: 380px; max-width: 100%; }
  .card {
    border-radius: 24px;
    padding: 26px 22px 20px;
    background: linear-gradient(135deg, #0a6e4a 0%, #0d8a5f 55%, #34C38F 100%);
    box-shadow: 0 10px 30px rgba(10,110,74,0.25);
    color: #fff;
  }
  .header-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .ciclos-badge {
    width: 30px; height: 30px; border-radius: 50%; background: #FAC775; color: #6e4c00;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;
    flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .logo-wrap {
    width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 3px solid rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: 24px; color: #0a6e4a; flex-shrink: 0;
  }
  .bienvenida { font-size: 21px; font-weight: 700; line-height: 1.3; }
  h1 { font-size: 16px; line-height: 1.4; margin: 0 0 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  h1 i { font-size: 18px; }
  .beneficio-sub { font-size: 13px; line-height: 1.5; margin: 0 0 14px; opacity: 0.95; }
  .beneficio-precios { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; margin: 0 0 8px; text-transform: uppercase; opacity: 0.9; }
  .lista-precios { list-style: none; margin: 0 0 14px; padding: 0; font-size: 13px; line-height: 2; }
  .lista-precios li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed rgba(255,255,255,0.3); padding: 5px 0; }
  .lista-precios b { font-weight: 700; }
  .beneficio-ahorro { opacity: 0.85; font-size: 12px; }
  .divisor { border-top: 1px solid rgba(255,255,255,0.35); margin: 0 0 14px; }
  .beneficio-condicion { font-size: 11px; line-height: 1.5; opacity: 0.9; margin: 0 0 22px; display: flex; align-items: flex-start; gap: 6px; }
  .beneficio-condicion i { font-size: 14px; color: #FAC775; flex-shrink: 0; margin-top: 1px; }
  .stamps { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .stamp {
    width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.5);
  }
  .stamp.filled { background: #378ADD; border-color: #378ADD; }
  .stamp.filled i { color: #E6F1FB; font-size: 22px; }
  .stamp i { font-size: 20px; color: rgba(255,255,255,0.6); }
  .progreso-texto { font-size: 12px; opacity: 0.9; margin-bottom: 18px; }
  .footer { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    background: rgba(255,255,255,0.2); color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 20px; text-decoration: none; display: flex; align-items: center; gap: 6px;
  }
  .pill:active { opacity: 0.75; }
  .reward-banner {
    margin-top: 16px; background: rgba(255,255,255,0.95); border: 2px dashed #fff;
    border-radius: 14px; padding: 12px 14px; text-align: center; display: none;
  }
  .reward-banner.show { display: block; }
  .reward-banner p { margin: 0; font-size: 14px; color: #0a6e4a; font-weight: bold; }

  .historial {
    background: #fff; border-radius: 16px; margin-top: 14px; padding: 16px 18px;
    box-shadow: 0 4px 14px rgba(10,110,74,0.08);
  }
  .historial h3 { font-size: 14px; margin: 0 0 12px; color: #2c2c2c; }
  .servicio {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #f0f4f2; font-size: 13px; gap: 10px;
  }
  .servicio:last-child { border-bottom: none; }
  .servicio .row-left { display: flex; align-items: flex-start; flex: 1; min-width: 0; }
  .servicio .num {
    width: 24px; height: 24px; border-radius: 50%; background: #34C38F; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    margin-right: 10px; flex-shrink: 0;
  }
  .servicio .info { flex: 1; min-width: 0; }
  .servicio .detalle { font-weight: 600; color: #2c2c2c; }
  .servicio .fecha { font-size: 11px; color: #918a9e; margin-top: 2px; }
  .promo-tag {
    font-size: 11px; font-weight: 700; color: #0a6e4a; background: #E7F8EE;
    display: inline-block; padding: 3px 8px; border-radius: 8px; margin-top: 4px;
  }
  .btn-pdf {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: #E7F8EE; color: #0a6e4a;
    display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px;
  }
  .btn-pdf.disabled { opacity: 0.35; pointer-events: none; }
  .estado { text-align: center; font-size: 13px; color: #877f95; padding: 30px 0; }

  /* ── Barra de iconos (tema, notificaciones) ── */
  .icon-bar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 16px; }
  .theme-toggle {
    width: 42px; height: 42px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 10px rgba(10,110,74,0.18); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: #0a6e4a;
  }

  /* ── MODO OSCURO ── */
  body.dark { background: #0d1712; }
  body.dark .historial { background: #16211c; box-shadow: none; }
  body.dark .historial h3 { color: #eef5f1; }
  body.dark .servicio { border-bottom-color: #20302a; }
  body.dark .servicio .detalle { color: #eef5f1; }
  body.dark .servicio .fecha { color: #8fa89c; }
  body.dark .promo-tag { background: #123527; color: #5fd9a6; }
  body.dark .btn-pdf { background: #123527; color: #5fd9a6; }
  body.dark .estado { color: #8fa89c; }
  body.dark .theme-toggle { background: #16211c; color: #bfe8d6; }

  /* ── Botón "Ver mensajes" ── */
  .msgs-btn {
    width: 100%; background: #fff; border: none; border-radius: 16px; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #2c2c2c;
    box-shadow: 0 4px 14px rgba(10,110,74,0.08); margin-bottom: 14px; cursor: pointer; position: relative;
  }
  .msgs-btn i { font-size: 20px; color: #0a6e4a; }
  .msgs-badge {
    position: absolute; top: -6px; right: -6px; background: #e53e3e; color: #fff; font-size: 11px;
    font-weight: 800; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; padding: 0 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  body.dark .msgs-btn { background: #16211c; color: #eef5f1; box-shadow: none; }

  /* ── Banner de promoción (carrusel) ── */
  .promo-banner {
    border-radius: 18px; overflow: hidden; margin-bottom: 14px; background: #fff;
    box-shadow: 0 6px 18px rgba(10,110,74,0.12);
  }
  .promo-banner-media { width: 100%; display: block; }
  .promo-banner-media img, .promo-banner-media video { width: 100%; display: block; max-height: 220px; object-fit: cover; }
  .promo-banner-texto { padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #2c2c2c; }
  body.dark .promo-banner { background: #16211c; }
  body.dark .promo-banner-texto { color: #eef5f1; }
  .promo-dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0 2px; }
  .promo-dot { width: 6px; height: 6px; border-radius: 50%; background: #d5e6dd; }
  .promo-dot.active { background: #0a6e4a; }
  body.dark .promo-dot { background: #2a3b32; }
  body.dark .promo-dot.active { background: #5fd9a6; }

  /* ── Modal historial de mensajes ── */
  .msgs-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .msgs-overlay.show { display: flex; }
  .msgs-box {
    background: #fff; width: 100%; max-width: 420px; border-radius: 20px 20px 0 0;
    max-height: 80vh; overflow-y: auto; padding: 18px 18px 24px;
  }
  body.dark .msgs-box { background: #16211c; color: #eef5f1; }
  .msgs-box h3 { margin: 0 0 14px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .msgs-box .cerrar { cursor: pointer; font-size: 20px; color: #918a9e; }
  .msg-item { border-bottom: 1px solid #f0f4f2; padding: 12px 0; font-size: 13px; }
  .msg-item:last-child { border-bottom: none; }
  .msg-item .msg-fecha { font-size: 11px; color: #918a9e; margin-bottom: 4px; }
  .msg-item .msg-media { width: 100%; max-height: 160px; object-fit: cover; border-radius: 10px; margin-top: 6px; }
  body.dark .msg-item { border-bottom-color: #20302a; }
</style>
</head>
<body>
<script>
  // Aplica el tema guardado antes de pintar, para evitar parpadeo
  if (localStorage.getItem('lj_theme') === 'dark') document.body.classList.add('dark');
</script>
<div class="wrap">
  <div class="icon-bar">
    <button class="theme-toggle" id="notif-btn" onclick="activarNotificaciones()" title="Activar notificaciones">
      <i class="ti ti-bell" id="notif-icon"></i>
    </button>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"><i class="ti ti-sun" id="theme-icon"></i></button>
  </div>
  <div id="app">
    <div class="estado" id="cargando">Cargando tu tarjeta...</div>
  </div>
</div>

<div class="msgs-overlay" id="msgs-overlay" onclick="if(event.target===this) cerrarMensajes()">
  <div class="msgs-box">
    <h3>Mensajes y promociones <span class="cerrar" onclick="cerrarMensajes()"><i class="ti ti-x"></i></span></h3>
    <div id="msgs-lista"></div>
  </div>
</div>

<script>
const META = 2;
const INSTAGRAM_URL = "https://instagram.com/llama.a.jhon";
const WHATSAPP_URL = "https://wa.me/593987738569";

const params = new URLSearchParams(window.location.search);
// Si el link trae "?id=...", lo guardamos para recordarlo. Así, cuando el
// cliente abra la app desde el ícono de su pantalla de inicio (sin el "?id="
// en la URL), la tarjeta igual sabe quién es.
const idDeLaUrl = params.get('id');
if (idDeLaUrl) {
  localStorage.setItem('lj_clienteId', idDeLaUrl);
}
const clienteId = idDeLaUrl || localStorage.getItem('lj_clienteId');

// Mismo Apps Script que usa el panel de Llama a Jhon (LJ_SHEET_URL en index.html)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkcc37gOiRP0R0F3wJiehCNVzBRpT76q9CA6kJ-LXq2chr0gck6HqMrMR62xr3UhK3zw/exec';

let promoData = null; // { activa, historial } — cargado junto con la tarjeta

async function cargarTarjeta() {
  const app = document.getElementById('app');
  if (!clienteId) {
    app.innerHTML = '<div class="estado">Falta el identificador del cliente en el link.</div>';
    return;
  }
  try {
    const [resp, respPromo] = await Promise.all([
      fetch(SCRIPT_URL + '?action=tarjeta&id=' + encodeURIComponent(clienteId)),
      fetch(SCRIPT_URL + '?action=promocionActiva&clienteId=' + encodeURIComponent(clienteId)).catch(() => null)
    ]);
    const data = await resp.json();
    if (respPromo) { try { promoData = await respPromo.json(); } catch (e) { promoData = null; } }
    if (!data.success) {
      app.innerHTML = '<div class="estado">No se encontró tu tarjeta. Contacta a @llama.a.jhon.</div>';
      return;
    }
    renderTarjeta(data);
    actualizarBadgeMensajes();
  } catch (err) {
    app.innerHTML = '<div class="estado">No se pudo cargar tu tarjeta. Intenta de nuevo.</div>';
  }
}

function renderTarjeta(data) {
  const totalServicios = Number(data.totalSellos) || 0;
  // Ciclo completo = META sellos (mantenimientos normales) + 1 mantenimiento de promoción
  // (el que usa el descuento ganado). Tras ese mantenimiento de promoción, los sellos vuelven a 0.
  const CICLO = META + 1;
  const posEnCiclo = totalServicios % CICLO; // 0 = justo se usó la promo y se reinició
  const selloEnCiclo = posEnCiclo === 0 ? 0 : Math.min(posEnCiclo, META);
  const esperandoPromocion = posEnCiclo === 0 && totalServicios > 0 ? false : posEnCiclo >= META;
  const ciclosCompletados = Math.floor(totalServicios / CICLO);

  let stampsHtml = '';
  for (let i = 0; i < META; i++) {
    if (i < selloEnCiclo) {
      stampsHtml += '<div class="stamp filled"><i class="ti ti-check"></i></div>';
    } else {
      stampsHtml += '<div class="stamp"><i class="ti ti-air-conditioning"></i></div>';
    }
  }

  let historialHtml = '';
  if (data.historial && data.historial.length) {
    // Recorremos en orden cronológico (mas antiguo primero) para llevar la cuenta
    // real de sellos: solo suma cuando la visita SI cuenta como sello (s.cuentaSello),
    // no por su posición en la lista (así "Reparación", "Instalación", etc. no rompen el ciclo)
    let selloCounter = 0;
    const historialConPromo = data.historial.map(s => {
      let esPromocion = false;
      if (s.cuentaSello) {
        selloCounter++;
        esPromocion = selloCounter % CICLO === 0;
      }
      return Object.assign({}, s, { esPromocion: esPromocion });
    });

    historialConPromo.slice().reverse().forEach((s, idx) => {
      const numVisita = historialConPromo.length - idx; // posición general en el listado (solo para mostrar el #)
      const pdfBtn = s.link_reporte
        ? '<a class="btn-pdf" href="' + s.link_reporte + '" target="_blank" rel="noopener" title="Descargar PDF"><i class="ti ti-file-type-pdf"></i></a>'
        : '<span class="btn-pdf disabled" title="Reporte no disponible"><i class="ti ti-file-type-pdf"></i></span>';
      const etiquetaPromo = s.esPromocion
        ? '<div class="promo-tag">🎁 Limpieza Promoción</div>'
        : '';
      historialHtml += '<div class="servicio"><div class="row-left"><div class="num">' + numVisita + '</div><div class="info"><div class="detalle">' + (s.tipo || 'Servicio') + '</div><div class="fecha">' + (s.fecha || '') + '</div>' + etiquetaPromo + '</div></div>' + pdfBtn + '</div>';
    });
  } else {
    historialHtml = '<div class="servicio">Aún no hay servicios registrados.</div>';
  }

  document.getElementById('app').innerHTML =
    renderMsgsBtn() +
    renderPromoBanner() +
    '<div class="card">' +
      '<div class="header-row">'+
        '<div class="logo-wrap"><i class="ti ti-air-conditioning"></i></div>'+
        '<div class="bienvenida" style="flex:1;">Bienvenido/a<br>' + (data.nombre || '') + '</div>'+
        (ciclosCompletados > 0 ? '<div class="ciclos-badge" title="Veces que ha completado su tarjeta">' + ciclosCompletados + '</div>' : '') +
      '</div>' +
      '<h1>¡Gracias por tu confianza! <i class="ti ti-snowflake"></i></h1>' +
      '<div class="beneficio-sub">Al completar tus 2 sellos, accede a tu beneficio de <b>CLIENTE FIEL</b>:</div>' +
      '<div class="beneficio-precios">Precios exclusivos en una sola visita</div>' +
      '<ul class="lista-precios">' +
        '<li><span>1 Aire</span> <b>$20</b> <span class="beneficio-ahorro">(Ahorras $5)</span></li>' +
        '<li><span>3 Aires</span> <b>$55</b> <span class="beneficio-ahorro">(Ahorras $10)</span></li>' +
        '<li><span>5 Aires</span> <b>$85</b> <span class="beneficio-ahorro">(Ahorras $15)</span></li>' +
      '</ul>' +
      '<div class="divisor"></div>' +
      '<div class="beneficio-condicion"><i class="ti ti-alert-triangle"></i><span>Condición: precios válidos únicamente para servicios realizados el mismo día y en el mismo domicilio.</span></div>' +
      '<div class="stamps">' + stampsHtml + '</div>' +
      '<div class="progreso-texto">' + (esperandoPromocion
        ? '¡Tarjeta completa! Tu próximo mantenimiento es tu Limpieza Promoción 🎁'
        : selloEnCiclo + ' de ' + META + ' sellos en tu tarjeta actual') + '</div>' +
      '<div class="footer">' +
        '<a class="pill" href="' + INSTAGRAM_URL + '" target="_blank" rel="noopener"><i class="ti ti-brand-instagram"></i> @llama.a.jhon</a>' +
        '<a class="pill" href="' + WHATSAPP_URL + '" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i> 0987738569</a>' +
      '</div>' +
      '<div class="reward-banner ' + (esperandoPromocion ? 'show' : '') + '">' +
        '<p>¡Completaste tu tarjeta! Ya tienes acceso a tus precios exclusivos de Cliente Fiel.</p>' +
      '</div>' +
    '</div>' +
    '<div class="historial">' +
      '<h3>Tu historial de servicios</h3>' +
      historialHtml +
    '</div>';
}

cargarTarjeta();

// ══════════════ MENSAJES Y PROMOCIÓN ══════════════
const LJ_VISTOS_KEY = 'lj_promos_vistas';

function getVistos() {
  try { return JSON.parse(localStorage.getItem(LJ_VISTOS_KEY) || '[]'); } catch (e) { return []; }
}

function contarNoVistos() {
  if (!promoData || !promoData.historial) return 0;
  const vistos = getVistos();
  return promoData.historial.filter(p => vistos.indexOf(String(p.id)) === -1).length;
}

function renderMsgsBtn() {
  const noVistos = contarNoVistos();
  return '<button class="msgs-btn" onclick="abrirMensajes()"><i class="ti ti-message-circle"></i> Ver mensajes' +
    (noVistos > 0 ? '<span class="msgs-badge">' + noVistos + '</span>' : '') +
    '</button>';
}

function actualizarBadgeMensajes() {
  // Badge numérico sobre el ícono de la app (solo funciona en Android/Chrome, no en iPhone)
  const n = contarNoVistos();
  if ('setAppBadge' in navigator) {
    if (n > 0) navigator.setAppBadge(n).catch(() => {});
    else navigator.clearAppBadge().catch(() => {});
  }
}

let promoDotIndex = 0;
let promoDotTimer = null;

function renderPromoBanner() {
  if (!promoData || !promoData.activa) return '';
  const promo = promoData.activa;
  const urls = (promo.mediaUrls || '').split(',').filter(Boolean);
  let mediaHtml = '';
  let dotsHtml = '';
  if (urls.length) {
    mediaHtml = urls.map((u, i) =>
      '<div class="promo-banner-media" style="display:' + (i === 0 ? 'block' : 'none') + '" data-slide="' + i + '">' +
        (u.match(/\.mp4|video/) ? '<video src="' + u + '" muted autoplay loop playsinline></video>' : '<img src="' + u + '">') +
      '</div>'
    ).join('');
    if (urls.length > 1) {
      dotsHtml = '<div class="promo-dots">' + urls.map((_, i) => '<div class="promo-dot' + (i === 0 ? ' active' : '') + '"></div>').join('') + '</div>';
    }
  }
  return '<div class="promo-banner" id="promo-banner">' + mediaHtml +
    '<div class="promo-banner-texto">' + (promo.mensaje || '') + '</div>' +
    dotsHtml +
    '</div>';
}

// Carrusel automático: cambia de foto cada 4 segundos si la promo tiene más de una
(function iniciarCarruselPromo() {
  setInterval(() => {
    const banner = document.getElementById('promo-banner');
    if (!banner) return;
    const slides = banner.querySelectorAll('[data-slide]');
    const dots = banner.querySelectorAll('.promo-dot');
    if (slides.length < 2) return;
    slides[promoDotIndex].style.display = 'none';
    if (dots[promoDotIndex]) dots[promoDotIndex].classList.remove('active');
    promoDotIndex = (promoDotIndex + 1) % slides.length;
    slides[promoDotIndex].style.display = 'block';
    if (dots[promoDotIndex]) dots[promoDotIndex].classList.add('active');
  }, 4000);
})();

function abrirMensajes() {
  const lista = document.getElementById('msgs-lista');
  const historial = (promoData && promoData.historial) || [];
  if (!historial.length) {
    lista.innerHTML = '<div class="estado">Aún no hay mensajes.</div>';
  } else {
    lista.innerHTML = historial.map(p => {
      const urls = (p.mediaUrls || '').split(',').filter(Boolean);
      const mediaHtml = urls.map(u => u.match(/\.mp4|video/)
        ? '<video src="' + u + '" class="msg-media" controls muted></video>'
        : '<img src="' + u + '" class="msg-media">'
      ).join('');
      return '<div class="msg-item"><div class="msg-fecha">' + (p.fechaCreacion ? new Date(p.fechaCreacion).toLocaleDateString('es-EC') : '') + '</div>' +
        '<div>' + (p.mensaje || '') + '</div>' + mediaHtml + '</div>';
    }).join('');
  }
  // Marca todos como vistos, y actualiza el contador rojo y el badge del ícono
  const vistos = getVistos();
  historial.forEach(p => { if (vistos.indexOf(String(p.id)) === -1) vistos.push(String(p.id)); });
  localStorage.setItem(LJ_VISTOS_KEY, JSON.stringify(vistos));
  document.getElementById('msgs-overlay').classList.add('show');
  const btn = document.querySelector('.msgs-btn');
  if (btn) btn.outerHTML = renderMsgsBtn();
  actualizarBadgeMensajes();
}

function cerrarMensajes() {
  document.getElementById('msgs-overlay').classList.remove('show');
}

function toggleTheme(){
  const dark = document.body.classList.toggle('dark');
  localStorage.setItem('lj_theme', dark ? 'dark' : 'light');
  actualizarIconoTema();
}
function actualizarIconoTema(){
  const icon = document.getElementById('theme-icon');
  icon.className = document.body.classList.contains('dark') ? 'ti ti-moon' : 'ti ti-sun';
}
</script>

<script>
  // Conecta esta tarjeta con OneSignal para poder mandarle avisos push
  // (recordatorios de mantenimiento y promociones) aunque tenga la app cerrada.
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  let oneSignalListo = null;

  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
      appId: "8e1254c6-a1e6-438f-87d9-8d6a7479e72f"
    });

    // Etiqueta esta suscripción con el ID del cliente (el mismo "?id=" del
    // link de su tarjeta). Así, desde el panel, podemos enviarle un push
    // SOLO a él (ej. su recordatorio de mantenimiento) usando ese mismo ID,
    // sin tener que guardar tokens en ningún lado.
    if (clienteId) {
      try {
        await OneSignal.login(clienteId);
      } catch (err) {
        console.error('No se pudo vincular OneSignal con el cliente:', err);
      }
    }

    oneSignalListo = OneSignal;

    // Diagnóstico: muestra en la consola si el "trabajador" quedó
    // realmente registrado, y con qué scope.
    navigator.serviceWorker.getRegistrations().then((regs) => {
      console.log('Service workers registrados:', regs.map(r => ({ scope: r.scope, script: r.active && r.active.scriptURL })));
    });

    // Si el cliente ya había dado permiso antes, refleja eso en el ícono
    // de la campana (así no le pedimos de nuevo algo que ya aceptó).
    if (OneSignal.Notifications.permission) {
      document.getElementById('notif-icon').className = 'ti ti-bell-ringing-2';
    }
  });

  // Se llama cuando el cliente TOCA el botón de la campana. Pedir el
  // permiso como reacción directa a un toque (en vez de automático al
  // cargar la página) evita que Chrome lo bloquee en silencio.
  async function activarNotificaciones() {
    if (!oneSignalListo) {
      alert('Dale un segundo a la página para cargar e inténtalo de nuevo.');
      return;
    }
    try {
      const permiso = await oneSignalListo.Notifications.requestPermission();
      const icon = document.getElementById('notif-icon');
      if (oneSignalListo.Notifications.permission) {
        icon.className = 'ti ti-bell-ringing-2';
        alert('¡Listo! Ya vas a recibir avisos de Llama a Jhon.');
      } else {
        icon.className = 'ti ti-bell-off';
        alert('No se activaron las notificaciones. Si tocaste "Bloquear" por error, entra a la configuración de notificaciones del sitio en Chrome para permitirlo.');
      }
    } catch (err) {
      console.error('No se pudo pedir permiso de notificaciones:', err);
      alert('Hubo un problema activando las notificaciones. Intenta de nuevo.');
    }
  }
</script>
